spring.application.name=business-dashboard
server.port=${PORT:8080}
spring.web.resources.static-locations=classpath:/static/

# Admin panel login (protects /admin and /api/admin/**).
# IMPORTANT: override these with real values via ADMIN_USERNAME / ADMIN_PASSWORD
# environment variables before deploying anywhere public - do not rely on the defaults.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:changeme123}
